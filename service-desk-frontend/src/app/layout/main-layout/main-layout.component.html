<div
  class="relative min-h-screen overflow-hidden bg-slate-950 bg-[radial-gradient(ellipse_at_top,_var(--tw-gradient-stops))] from-purple-900/30 via-slate-950 to-slate-950 text-white"
>
  <div class="blob blob1"></div>
  <div class="blob blob2"></div>
  <div class="blob blob3"></div>
  <header
    class="sticky top-0 z-40 border-b border-slate-800/80 bg-slate-900/60 backdrop-blur-md"
  >
    <div
      class="mx-auto flex w-full max-w-7xl items-center justify-between gap-4 px-4 py-3 sm:px-6"
    >
      <div class="flex items-center gap-3">
        <div
          class="flex h-10 w-10 items-center justify-center rounded-xl bg-gradient-to-br from-purple-600 to-pink-600 text-sm font-black shadow-lg shadow-purple-600/30"
        >
          SD
        </div>
        <div>
          <h1 class="text-lg font-bold tracking-tight">Service Desk</h1>
          <p class="text-xs text-slate-400">Panel de incidencias</p>
        </div>
      </div>

      <div class="flex items-center gap-3">
        <div
          class="hidden items-center gap-2 rounded-full border border-slate-800/80 bg-slate-900/60 px-3 py-1.5 text-xs text-slate-300 backdrop-blur-md md:flex"
        >
          <span class="relative flex h-2 w-2">
            <span
              class="absolute inline-flex h-full w-full animate-ping rounded-full bg-emerald-400 opacity-75"
            ></span>
            <span
              class="relative inline-flex h-2 w-2 rounded-full bg-emerald-400"
            ></span>
          </span>
          Alta Disponibilidad (NGINX)
        </div>

        <div class="flex items-center gap-3">
          <div class="relative">
            <button
              type="button"
              (click)="toggleMenu($event)"
              title="Mi perfil"
              class="flex items-center gap-2.5 rounded-xl px-2 py-1.5 transition hover:bg-slate-800/50"
            >
              <app-avatar [usuario]="usuario()" [tamano]="'md'" />
              <div class="hidden text-left sm:block">
                <div class="flex items-center gap-2">
                  <p class="text-sm font-semibold leading-tight">
                    @if (usuario()) {
                      {{ usuario()!.nombre }}
                    }
                  </p>
                  <span
                    class="rounded-full border px-2.5 py-0.5 text-[10px] font-semibold uppercase tracking-wider"
                    [class]="claseRol()"
                  >
                    {{ rolLabel() }}
                  </span>
                </div>
                @if (usuario()?.rol === 'ROLE_ADMIN') {
                  <p class="mt-0.5 flex items-center gap-1 text-xs text-purple-400">
                    <span>⚙️</span> Gestión global
                  </p>
                } @else {
                  <p class="mt-0.5 text-xs text-slate-500">Panel de incidencias</p>
                }
              </div>
              <svg
                xmlns="http://www.w3.org/2000/svg"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                class="hidden h-4 w-4 text-slate-500 transition sm:block"
                [class.rotate-180]="menuAbierto()"
              >
                <polyline points="6 9 12 15 18 9"></polyline>
              </svg>
            </button>

            @if (menuAbierto()) {
              <div
                class="absolute right-0 top-full z-50 mt-2 w-72 overflow-hidden rounded-2xl border border-slate-800/80 bg-slate-900/95 p-2 shadow-2xl backdrop-blur-md"
                (click)="$event.stopPropagation()"
              >
                <div class="flex items-center gap-3 rounded-xl bg-slate-950/50 p-3">
                  <app-avatar [usuario]="usuario()" [tamano]="'lg'" />
                  <div class="min-w-0">
                    <p class="truncate text-sm font-semibold">
                      {{ usuario()?.nombre }}
                    </p>
                    <p class="truncate text-xs text-slate-400">
                      {{ usuario()?.email }}
                    </p>
                    <span
                      class="mt-1 inline-block rounded-full border px-2 py-0.5 text-[10px] font-semibold uppercase tracking-wider"
                      [class]="claseRol()"
                    >
                      {{ rolLabel() }}
                    </span>
                  </div>
                </div>
                <button
                  type="button"
                  (click)="irAlPerfil($event)"
                  class="mt-1 flex w-full items-center gap-2.5 rounded-xl px-3 py-2.5 text-left text-sm text-slate-300 transition hover:bg-purple-600/20 hover:text-white"
                >
                  <span class="text-base">👤</span> Mi Perfil
                </button>
                <button
                  type="button"
                  (click)="cerrarSesion()"
                  class="flex w-full items-center gap-2.5 rounded-xl px-3 py-2.5 text-left text-sm text-slate-300 transition hover:bg-rose-500/10 hover:text-rose-400"
                >
                  <span class="text-base">🚪</span> Cerrar Sesión
                </button>
              </div>
            }
          </div>
        </div>
      </div>
    </div>
  </header>

  @if (esAdmin()) {
    <nav class="relative z-10 border-b border-slate-800/80 bg-slate-950/40 backdrop-blur-md">
      <div class="mx-auto flex w-full max-w-7xl gap-1 px-4 pt-3 sm:px-6">
        <a
          routerLink="/dashboard"
          routerLinkActive="border-purple-500/60 bg-gradient-to-r from-purple-600/20 to-pink-600/20 text-white"
          [routerLinkActiveOptions]="{ exact: true }"
          class="rounded-t-xl border border-b-0 border-transparent px-4 py-2.5 text-sm font-semibold text-slate-400 transition hover:text-white"
        >
          📋 Tickets
        </a>
        <a
          routerLink="/dashboard/personal"
          routerLinkActive="border-purple-500/60 bg-gradient-to-r from-purple-600/20 to-pink-600/20 text-white"
          class="rounded-t-xl border border-b-0 border-transparent px-4 py-2.5 text-sm font-semibold text-slate-400 transition hover:text-white"
        >
          👥 Gestión de Personal
        </a>
      </div>
    </nav>
  }

  <div class="relative z-10">
    <router-outlet />
  </div>
</div>
