services:
  nginx:
    image: nginx:1.25
    ports:
      - "8080:8080"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend1
      - backend2

  backend1:
    image: eclipse-temurin:21-jdk
    command: ["java", "-jar", "/app/app.jar"]
    volumes:
      - ./target/ServiceDesk-0.0.1-SNAPSHOT.jar:/app/app.jar
    environment:
      SERVER_PORT: 8081
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: mysql
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/servicedesk_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    depends_on:
      - mysql

  backend2:
    image: eclipse-temurin:21-jdk
    command: ["java", "-jar", "/app/app.jar"]
    volumes:
      - ./target/ServiceDesk-0.0.1-SNAPSHOT.jar:/app/app.jar
    environment:
      SERVER_PORT: 8082
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: mysql
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/servicedesk_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    depends_on:
      - mysql

  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: mysql
      MYSQL_DATABASE: servicedesk_db
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data:
